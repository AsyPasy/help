name: RPGHealth
version: 1.0.0
main: com.rpghealth.plugin.RPGHealthPlugin
api-version: 1.20
description: RPG Health and Leveling System
author: RPGHealth

commands:
  rpghealth:
    description: Shows your RPG health stats
    usage: /rpghealth
  sethealth:
    description: Sets a player's level
    usage: /sethealth <player> <level>
    permission: rpghealth.admin
  addxp:
    description: Adds XP to a player
    usage: /addxp <player> <amount>
    permission: rpghealth.admin
  rpgreset:
    description: Resets a player's RPG data to level 1
    usage: /rpgreset <player>
    permission: rpghealth.admin

permissions:
  rpghealth.admin:
    description: Access to admin commands
    default: op
